<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cancel Booking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E2A22; --paper:#F1EEE6; --brass:#B8893C;
    --green:#24402F; --green-deep:#16261C; --line:#D8D1C0; --error:#8C3B32; --radius:4px;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Work Sans',sans-serif; background:var(--paper); color:var(--ink); min-height:100vh;}
  h1,h2{ font-family:'Fraunces',serif; margin:0; font-weight:600; }
  .stripe-header{
    height:8px; width:100%;
    background:repeating-linear-gradient(-45deg,var(--green) 0px,var(--green) 14px,var(--brass) 14px,var(--brass) 20px,#E7E2D6 20px,#E7E2D6 34px);
  }
  .wrap{ max-width:420px; margin:0 auto; padding:40px 20px; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:20px; margin-top:16px; }
  .summary-row{ display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .summary-row:last-child{ border-bottom:none; }
  .summary-row .k{ color:#6b6558; }
  .summary-row .v{ font-weight:600; }
  .btn{
    display:block; width:100%; padding:14px; border:none; border-radius:var(--radius);
    font-weight:600; font-size:15px; cursor:pointer; margin-top:16px;
  }
  .btn.danger{ background:var(--error); color:#fff; }
  .btn.secondary{ background:transparent; color:var(--green); border:1px solid var(--green); }
  .loading{ text-align:center; padding:60px 0; color:#8a8471; }
  .err{ background:#FBEAE7; color:var(--error); border:1px solid #E3B3AB; border-radius:var(--radius); padding:14px; font-size:14px; }
  .done{ text-align:center; padding:20px 0; }
  .done .mark{ width:56px;height:56px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 14px;}
</style>
</head>
<body>
<div class="stripe-header"></div>
<div class="wrap" id="app"><div class="loading">Loading...</div></div>

<script>
const API_URL = 'https://salon-booking-system.osamajunaid.workers.dev';
const bookingId = new URLSearchParams(window.location.search).get('id');
let CURRENT = null;

async function boot(){
  if(!bookingId){
    document.getElementById('app').innerHTML = `<div class="err">Invalid link.</div>`;
    return;
  }
  const res = await fetch(API_URL + '/booking?id=' + encodeURIComponent(bookingId));
  const data = await res.json();
  if(data.error){
    document.getElementById('app').innerHTML = `<div class="err">${data.error}</div>`;
    return;
  }
  CURRENT = data;
  if(data.status === 'Cancelled'){
    render(true);
    return;
  }
  render(false);
}

function render(alreadyCancelled){
  if(alreadyCancelled){
    document.getElementById('app').innerHTML = `
      <h1>Booking Details</h1>
      <div class="card">
        <div class="summary-row"><span class="k">Service</span><span class="v">${CURRENT.serviceName}</span></div>
        <div class="summary-row"><span class="k">Professional</span><span class="v">${CURRENT.staffName}</span></div>
        <div class="summary-row"><span class="k">Date</span><span class="v">${CURRENT.date}</span></div>
        <div class="summary-row"><span class="k">Time</span><span class="v">${CURRENT.startTime}</span></div>
      </div>
      <div class="err" style="margin-top:16px;">Yeh booking pehle hi cancel ho chuki hai.</div>
    `;
    return;
  }
  document.getElementById('app').innerHTML = `
    <h1>Cancel Booking?</h1>
    <div class="card">
      <div class="summary-row"><span class="k">Service</span><span class="v">${CURRENT.serviceName}</span></div>
      <div class="summary-row"><span class="k">Professional</span><span class="v">${CURRENT.staffName}</span></div>
      <div class="summary-row"><span class="k">Date</span><span class="v">${CURRENT.date}</span></div>
      <div class="summary-row"><span class="k">Time</span><span class="v">${CURRENT.startTime}</span></div>
    </div>
    <div id="err"></div>
    <button class="btn danger" onclick="confirmCancel()">Yes, Cancel This Booking</button>
    <button class="btn secondary" onclick="window.close()">Keep My Booking</button>
  `;
}

async function confirmCancel(){
  const res = await fetch(API_URL + '/cancel', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ bookingId, reason:'CUSTOMER' })
  });
  const data = await res.json();
  if(data.error){
    document.getElementById('err').innerHTML = `<div class="err">${data.error}</div>`;
    return;
  }
  document.getElementById('app').innerHTML = `
    <div class="done">
      <div class="mark">✓</div>
      <h2>Booking Cancelled</h2>
      <div style="color:#6b6558;margin-top:8px;font-size:14px;">Aapki booking cancel kar di gayi hai. Dobara book karne ke liye humara booking link use karein.</div>
    </div>
  `;
}

boot();
</script>
</body>
</html>
