<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#F1EEE6; --paper:#12171C; --paper-2:#232B33;
    --brass:#D4AF6A; --brass-dark:#C9A54D;
    --green:#3FA79A; --green-deep:#1B2229;
    --line:#2B343C; --error:#E0665C; --radius:4px;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Work Sans',sans-serif; background:var(--paper); color:var(--ink); }
  h1,h2,h3{ font-family:'Fraunces',serif; margin:0; font-weight:600; }
  .stripe-header{
    height:5px; width:100%;
    background:linear-gradient(90deg,var(--brass-dark) 0%,var(--brass) 25%,#F5DFA8 50%,var(--brass) 75%,var(--brass-dark) 100%);
  }
  .topbar{
    background:radial-gradient(ellipse at top, #223028 0%, var(--green-deep) 55%, #0D1410 100%);
    color:#fff; padding:26px 20px 28px; text-align:center;
    box-shadow:0 6px 20px rgba(0,0,0,0.35);
    position:relative;
  }
  .topbar .badge{
    width:40px; height:40px; margin:0 auto 8px; border-radius:50%;
    background:linear-gradient(145deg, var(--brass) 0%, var(--brass-dark) 100%);
    display:flex; align-items:center; justify-content:center; font-size:18px;
    box-shadow:0 4px 12px rgba(212,175,106,0.35), inset 0 1px 1px rgba(255,255,255,0.3);
  }
  .topbar h1{ font-size:22px; text-shadow:0 2px 8px rgba(0,0,0,0.4); }
  .topbar .sub{ font-size:12px; color:var(--brass); text-transform:uppercase; letter-spacing:0.1em; margin-top:4px;}

  .bell-wrap{ position:absolute; top:16px; right:16px; }
  .bell-btn{ background:none; border:none; font-size:20px; cursor:pointer; position:relative; padding:4px 6px; color:#fff; }
  .bell-badge{
    position:absolute; top:-2px; right:-2px; background:var(--error); color:#fff;
    font-size:10px; font-weight:700; min-width:16px; height:16px; border-radius:8px;
    display:flex; align-items:center; justify-content:center; padding:0 3px;
  }
  .notif-panel{
    display:none; position:absolute; top:36px; right:0; z-index:150;
    width:280px; max-height:340px; overflow-y:auto; text-align:left;
    background:var(--paper-2); border:1px solid var(--line); border-radius:8px;
    box-shadow:0 12px 28px rgba(0,0,0,0.5);
  }
  .notif-panel.show{ display:block; }
  .notif-panel-header{
    padding:10px 14px; font-size:12px; text-transform:uppercase; letter-spacing:0.05em;
    color:#9AA5AC; border-bottom:1px solid var(--line); font-weight:700;
  }
  .notif-item{ padding:10px 14px; border-bottom:1px solid var(--line); font-size:12px; color:var(--ink); }
  .notif-item:last-child{ border-bottom:none; }
  .notif-item .notif-time{ font-size:10px; color:#9AA5AC; margin-top:3px; }
  .notif-item.notif-cancel{ border-left:3px solid var(--error); }
  .notif-item.notif-new{ border-left:3px solid var(--ok, #5FBF8F); }
  .notif-empty{ padding:20px 14px; text-align:center; color:#9AA5AC; font-size:12px; }
  .wrap{ max-width:600px; margin:0 auto; padding:16px; }

  input[type=date]{ padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius); font-size:16px; background:var(--paper-2); color:var(--ink); width:100%; margin-bottom:16px;}

  .earnings-card{
    background:linear-gradient(160deg, var(--green-deep) 0%, #0D1410 100%);
    border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-bottom:16px;
  }
  .earnings-row{ display:flex; gap:10px; }
  .earnings-item{ flex:1; text-align:center; }
  .e-label{ font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:var(--brass); margin-bottom:4px; }
  .e-value{ font-family:'Fraunces',serif; font-size:18px; font-weight:600; color:#fff; }
  .e-value.gold{ color:var(--brass); }
  .e-sub{ font-size:10px; color:#9AA5AC; margin-top:2px; }
  .earnings-divider{ height:1px; background:var(--line); margin:14px 0; }

  .card{
    background:var(--paper-2); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; margin-bottom:12px;
  }
  .card-top{ display:flex; gap:12px; align-items:center; }
  .card-photo{ width:52px; height:52px; border-radius:50%; object-fit:cover; border:1px solid var(--line); flex-shrink:0; }
  .card-photo.placeholder{ display:flex; align-items:center; justify-content:center; background:var(--paper-2); font-size:20px; color:var(--brass-dark); }
  .card-info{ flex:1; }
  .card-time{ font-family:'Fraunces',serif; font-size:18px; font-weight:600; }
  .card-name{ font-size:14px; font-weight:600; margin-top:2px; }
  .card-service{ font-size:12px; color:#9AA5AC; margin-top:1px; }
  .status-pill{ padding:3px 8px; border-radius:10px; font-size:10px; font-weight:600; text-transform:uppercase; }
  .status-pill.Confirmed{ background:rgba(63,167,154,0.15); color:var(--green); }
  .status-pill.Completed{ background:rgba(212,175,106,0.15); color:var(--brass-dark); }

  .card-actions{ display:flex; gap:8px; margin-top:12px; }
  .btn{
    flex:1; padding:10px; border:none; border-radius:var(--radius);
    font-weight:600; font-size:13px; cursor:pointer;
  }
  .btn.notify{ background:transparent; color:var(--green); border:1px solid var(--green); }
  .btn.complete{ background:var(--green); color:#fff; }

  .empty{ text-align:center; padding:50px 10px; color:#9AA5AC; }
  .loading{ text-align:center; padding:40px; color:#9AA5AC; }

  .modal-bg{ position:fixed; inset:0; background:rgba(22,38,28,0.5); display:none; align-items:center; justify-content:center; padding:16px; z-index:10;}
  .modal-bg.show{ display:flex; }
  .modal{ background:var(--paper-2); color:var(--ink); border-radius:var(--radius); padding:20px; width:100%; max-width:380px; }
  .modal-actions{ display:flex; gap:10px; margin-top:16px; }
  .err{ background:rgba(224,102,92,0.12); color:var(--error); border:1px solid rgba(224,102,92,0.4); border-radius:var(--radius); padding:8px 10px; font-size:13px; margin-top:8px;}
  .toast{
    width:100%; padding:12px 16px; border-radius:8px; font-size:13px; font-weight:600;
    color:#fff; box-shadow:0 8px 24px rgba(0,0,0,0.4); animation:toast-in 0.3s ease;
  }
  .toast-new{ background:linear-gradient(135deg, #24402F, #1F9B52); border:1px solid #5FBF8F; }
  .toast-cancel{ background:linear-gradient(135deg, #4a1f1c, var(--error)); border:1px solid var(--error); }
  .toast-out{ animation:toast-out 0.4s ease forwards; }
  @keyframes toast-in{ from{ opacity:0; transform:translateY(-16px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes toast-out{ to{ opacity:0; transform:translateY(-16px); } }
</style>
</head>
<body>
<div class="stripe-header"></div>
<div id="toastContainer" style="position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center; width:90%; max-width:420px;"></div>
<div class="topbar">
  <div class="badge">✂️</div>
  <h1 id="staffName">Loading...</h1>
  <div class="sub">My Queue</div>
  <div class="bell-wrap">
    <button class="bell-btn" onclick="toggleNotificationPanel()">🔔<span class="bell-badge" id="bellBadge" style="display:none;">0</span></button>
    <div class="notif-panel" id="notifPanel">
      <div class="notif-panel-header">Notifications</div>
      <div id="notifList"><div class="notif-empty">Koi notification nahi hai.</div></div>
    </div>
  </div>
</div>
<div class="wrap">
  <div id="earningsBox"></div>
  <input type="date" id="dateFilter">
  <div id="list"><div class="loading">Loading...</div></div>
</div>

<div class="modal-bg" id="addServiceModalBg">
  <div class="modal">
    <h2 style="font-size:17px;margin-bottom:10px;">Add Service</h2>
    <div id="addServiceList" style="border:1px solid var(--line);border-radius:6px;padding:8px;max-height:200px;overflow-y:auto;margin-bottom:10px;"></div>
    <div id="addServiceErr"></div>
    <div class="modal-actions">
      <button class="btn notify" onclick="closeAddServiceModal()">Cancel</button>
      <button class="btn complete" onclick="submitAddService()">Add</button>
    </div>
  </div>
</div>

<script>
const API_URL = 'https://salon-booking-system.osamajunaid.workers.dev';
const RATE_PAGE_URL = 'https://osamajunaid15.github.io/new-smart-look-salon/rate.html';
const BOOKING_PAGE_URL = 'https://osamajunaid15.github.io/new-smart-look-salon/booking.html';

const params = new URLSearchParams(window.location.search);
const STAFF_ID = params.get('staff');
let SALON_NAME = 'Salon';
let INIT = null;

async function apiGet(path, p){
  const res = await fetch(API_URL + path + '?' + new URLSearchParams(p).toString());
  return res.json();
}
async function apiPost(path, body){
  const res = await fetch(API_URL + path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  return res.json();
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

async function boot(){
  if(!STAFF_ID){
    document.getElementById('list').innerHTML = `<div class="empty">Link mein ?staff=STAFF_ID missing hai.</div>`;
    return;
  }
  document.getElementById('dateFilter').value = todayStr();
  INIT = await apiGet('/init', {});
  SALON_NAME = INIT.salonName;
  const me = INIT.staff.find(s=>s.id === STAFF_ID);
  document.getElementById('staffName').textContent = me ? me.name : 'My Queue';
  document.getElementById('dateFilter').addEventListener('change', load);
  renderNotificationBell();
  load();
  loadEarnings();
}

async function loadEarnings(){
  const res = await apiGet('/staff-stats', { staffId: STAFF_ID });
  if(res.error){ document.getElementById('earningsBox').innerHTML = ''; return; }
  document.getElementById('earningsBox').innerHTML = `
    <div class="earnings-card">
      <div class="earnings-row">
        <div class="earnings-item"><div class="e-label">Aaj</div><div class="e-value">Rs. ${res.today.total}</div><div class="e-sub">${res.today.count} service</div></div>
        <div class="earnings-item"><div class="e-label">Is Hafte</div><div class="e-value">Rs. ${res.week.total}</div><div class="e-sub">${res.week.count} service</div></div>
        <div class="earnings-item"><div class="e-label">Is Mahine</div><div class="e-value">Rs. ${res.month.total}</div><div class="e-sub">${res.month.count} service</div></div>
      </div>
      ${(res.commissionAmount!=null || res.fixedSalary!=null) ? `
      <div class="earnings-divider"></div>
      <div class="earnings-row">
        ${res.commissionAmount!=null ? `<div class="earnings-item"><div class="e-label">Commission (${res.commissionPercent}%)</div><div class="e-value gold">Rs. ${res.commissionAmount}</div></div>` : ''}
        ${res.fixedSalary!=null ? `<div class="earnings-item"><div class="e-label">Fixed Salary</div><div class="e-value gold">Rs. ${res.fixedSalary}</div></div>` : ''}
      </div>` : ''}
    </div>
  `;
}

async function load(silent){
  const date = document.getElementById('dateFilter').value;
  if(!silent) document.getElementById('list').innerHTML = `<div class="loading">Loading...</div>`;
  const res = await apiGet('/bookings', { date, staffId: STAFF_ID });
  detectStaffBookingChanges(date, res.bookings || []);
  if(!res.bookings || !res.bookings.length){
    document.getElementById('list').innerHTML = `<div class="empty">Is din koi booking nahi hai.</div>`;
    return;
  }
  const html = res.bookings.filter(b=>b.status !== 'Cancelled').map(b=>{
    const photo = b.photo
      ? `<img class="card-photo" src="${b.photo}">`
      : `<div class="card-photo placeholder">${b.customerName.charAt(0).toUpperCase()}</div>`;
    const actions = b.status === 'Confirmed' ? `
      <div class="card-actions">
        <button class="btn notify" onclick="notifyReady('${b.phone}','${esc(b.customerName)}')">Notify Ready</button>
        <button class="btn notify" onclick="openAddServiceModal('${b.bookingId}','${b.serviceId}')">+ Service</button>
        <button class="btn complete" onclick="markComplete('${b.bookingId}','${b.phone}','${esc(b.customerName)}')">Complete</button>
      </div>` : '';
    return `<div class="card">
      <div class="card-top">
        ${photo}
        <div class="card-info">
          <div class="card-time">${b.startTime} - ${b.endTime}</div>
          <div class="card-name">${b.customerName} <span class="status-pill ${b.status}">${b.status}</span></div>
          <div class="card-service">${b.serviceName}</div>
        </div>
      </div>
      ${actions}
    </div>`;
  }).join('');
  document.getElementById('list').innerHTML = html || `<div class="empty">Is din koi booking nahi hai.</div>`;
}

function esc(s){ return String(s).replace(/'/g,"\\'"); }

/* ---------- NOTIFICATIONS (persistent bell, per-staff) ---------- */
let prevStaffBookingsMap = null;
let prevStaffBookingsDate = null;
const NOTIF_KEY = 'staffNotifications_' + STAFF_ID;

function detectStaffBookingChanges(date, bookings){
  if(prevStaffBookingsDate !== date){
    prevStaffBookingsDate = date;
    prevStaffBookingsMap = {};
    bookings.forEach(b => prevStaffBookingsMap[b.bookingId] = b.status);
    return;
  }
  const newMap = {};
  bookings.forEach(b => newMap[b.bookingId] = b.status);
  bookings.forEach(b => {
    const wasSeen = b.bookingId in prevStaffBookingsMap;
    if(!wasSeen && b.status === 'Confirmed'){
      pushNotification(`🆕 Nayi booking: ${b.startTime} — ${b.customerName} (${b.serviceName})`, 'new');
    } else if(wasSeen && prevStaffBookingsMap[b.bookingId] !== 'Cancelled' && b.status === 'Cancelled'){
      pushNotification(`❌ Cancel hui: ${b.startTime} — ${b.customerName}`, 'cancel');
    }
  });
  prevStaffBookingsMap = newMap;
}

function pushNotification(message, type){
  showToast(message, type);
  const list = JSON.parse(localStorage.getItem(NOTIF_KEY) || '[]');
  list.unshift({ message, type, time: new Date().toISOString(), read: false });
  localStorage.setItem(NOTIF_KEY, JSON.stringify(list.slice(0, 30)));
  renderNotificationBell();
}

function renderNotificationBell(){
  const list = JSON.parse(localStorage.getItem(NOTIF_KEY) || '[]');
  const unread = list.filter(n => !n.read).length;
  const badge = document.getElementById('bellBadge');
  badge.style.display = unread > 0 ? 'flex' : 'none';
  badge.textContent = unread > 9 ? '9+' : unread;

  const listEl = document.getElementById('notifList');
  if(list.length === 0){
    listEl.innerHTML = `<div class="notif-empty">Koi notification nahi hai.</div>`;
    return;
  }
  listEl.innerHTML = list.map(n => `
    <div class="notif-item ${n.type === 'cancel' ? 'notif-cancel' : 'notif-new'}">
      ${n.message}
      <div class="notif-time">${timeAgo(n.time)}</div>
    </div>
  `).join('');
}

function timeAgo(iso){
  const diffSec = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if(diffSec < 60) return 'Abhi';
  if(diffSec < 3600) return Math.floor(diffSec/60) + ' minute pehle';
  if(diffSec < 86400) return Math.floor(diffSec/3600) + ' ghante pehle';
  return Math.floor(diffSec/86400) + ' din pehle';
}

function toggleNotificationPanel(){
  const panel = document.getElementById('notifPanel');
  panel.classList.toggle('show');
  if(panel.classList.contains('show')){
    const list = JSON.parse(localStorage.getItem(NOTIF_KEY) || '[]');
    list.forEach(n => n.read = true);
    localStorage.setItem(NOTIF_KEY, JSON.stringify(list));
    renderNotificationBell();
  }
}
document.addEventListener('click', function(e){
  const wrap = document.querySelector('.bell-wrap');
  if(wrap && !wrap.contains(e.target)){
    document.getElementById('notifPanel').classList.remove('show');
  }
});

function showToast(message, type){
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast ' + (type === 'cancel' ? 'toast-cancel' : 'toast-new');
  toast.textContent = message;
  container.appendChild(toast);
  playBeep();
  setTimeout(() => {
    toast.classList.add('toast-out');
    setTimeout(() => toast.remove(), 400);
  }, 6000);
}
function playBeep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    osc.start();
    osc.stop(ctx.currentTime + 0.15);
  }catch(e){ /* audio blocked, silently ignore */ }
}

function waNumber(phone){
  let digits = String(phone||'').replace(/[^0-9]/g,'');
  if(digits.startsWith('0')) digits = '92' + digits.slice(1);
  return digits;
}

function notifyReady(phone, name){
  const msg = `Salaam ${name}! Main thori dair mein aapke liye free ho jaunga. Aap ab shop ke liye nikal sakte hain. — ${SALON_NAME}`;
  window.open('https://wa.me/' + waNumber(phone) + '?text=' + encodeURIComponent(msg), '_blank');
}

async function markComplete(id, phone, name){
  await apiPost('/complete', { bookingId:id });
  const rateLink = RATE_PAGE_URL + '?id=' + id;
  const msg = `Shukriya ${name}! Umeed hai service pasand aayi hogi. Apni service ko rate karein: ${rateLink}\n\nAgli baar dobara booking ke liye yeh link use karein: ${BOOKING_PAGE_URL} — ${SALON_NAME}`;
  window.open('https://wa.me/' + waNumber(phone) + '?text=' + encodeURIComponent(msg), '_blank');
  load();
}

let addServiceCurrentBooking = null;
function openAddServiceModal(bookingId, existingServiceIdCsv){
  const existingIds = String(existingServiceIdCsv||'').split(',').map(s=>s.trim());
  addServiceCurrentBooking = bookingId;
  const list = document.getElementById('addServiceList');
  list.innerHTML = INIT.services
    .filter(s => !existingIds.includes(s.id))
    .map(s => `
      <label style="display:flex;align-items:center;gap:8px;padding:5px 2px;font-size:13px;cursor:pointer;">
        <input type="checkbox" value="${s.id}" class="addServiceCheck"> ${s.name} (${s.duration}m)${s.price ? ' — ' + s.price : ''}
      </label>`).join('');
  if(!list.innerHTML) list.innerHTML = `<div style="font-size:13px;color:#9AA5AC;">Baaki sab services already shamil hain.</div>`;
  document.getElementById('addServiceErr').innerHTML = '';
  document.getElementById('addServiceModalBg').classList.add('show');
}
function closeAddServiceModal(){
  document.getElementById('addServiceModalBg').classList.remove('show');
  addServiceCurrentBooking = null;
}
async function submitAddService(){
  const serviceIds = Array.from(document.querySelectorAll('.addServiceCheck:checked')).map(c=>c.value);
  if(serviceIds.length === 0){
    document.getElementById('addServiceErr').innerHTML = `<div class="err">Kam az kam 1 service select karein.</div>`;
    return;
  }
  const res = await apiPost('/add-service', { bookingId: addServiceCurrentBooking, serviceIds });
  if(res.error){
    document.getElementById('addServiceErr').innerHTML = `<div class="err">${res.error}</div>`;
    return;
  }
  closeAddServiceModal();
  load();
  if(res.delayInfo){
    const d = res.delayInfo;
    const msg = `Salaam ${d.customerName}! Aapki appointment mein thori dair (~${d.overlapMinutes} minute) ki delay ho sakti hai. Maazrat ke sath. — ${SALON_NAME}`;
    if(confirm(`${d.customerName} (${d.startTime}) ka time ${d.overlapMinutes} minute overlap ho jayega. Notify karna chahenge?`)){
      window.open('https://wa.me/' + waNumber(d.phone) + '?text=' + encodeURIComponent(msg), '_blank');
    }
  }
}

setInterval(() => {
  if (document.visibilityState === 'visible') {
    load(true);
    loadEarnings();
  }
}, 30000);

boot();
</script>
</body>
</html>
